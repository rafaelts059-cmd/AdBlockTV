name: Build AdBlockTV APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract ZIP
        run: |
          unzip -o AdBlockTV-FINAL.zip
          if [ -d "AdBlockTV" ]; then cp -r AdBlockTV/. .; fi
          rm -rf AdBlockTV-FINAL.zip AdBlockTV
          ls -la
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AdBlockTV-APK
          path: app/build/outputs/apk/debug/*.apk
